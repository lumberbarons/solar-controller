name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Lets release.yaml run these same gates before it publishes anything,
  # so the test and lint definitions live in exactly one place.
  workflow_call:

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  GOLANGCI_LINT_VERSION: 'v2.12.2'

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: make build-frontend

      - name: Upload site build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-build
          path: internal/static/build
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download site build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: internal/static/build

      # readonly module mode in .golangci.yml catches dependencies missing from
      # go.mod, but not the reverse: stale requires, or a dependency added
      # without tidying.
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' and commit the result"
            exit 1
          fi

      - name: Verify module checksums
        run: go mod verify

      - name: Run Go tests with coverage gate
        run: make test-coverage

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download site build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: internal/static/build

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Independent of build-frontend: these checks run against site/ directly and
    # do not need the embedded build artifact.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Run ESLint
        working-directory: ./site
        run: npm run lint

      - name: Type check
        working-directory: ./site
        run: npm run typecheck

      - name: Run tests
        working-directory: ./site
        run: npm test

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download site build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: internal/static/build

      # govulncheck is reachability-based, so it reports only vulnerabilities
      # this code can actually reach, including standard-library CVEs that
      # Dependabot does not cover. repo-checkout is off because the action's
      # own checkout would wipe internal/static/build and break the //go:embed.
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          repo-checkout: false
          go-package: ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download site build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: internal/static/build

      # GitHub-hosted runners ship a working Docker daemon, so testcontainers
      # needs no extra setup.
      - name: Run integration tests
        run: make test-int
