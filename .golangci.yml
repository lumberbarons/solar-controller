version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - gocritic
    - gosec
    - misspell
    - revive
  settings:
    errcheck:
      check-blank: true
    gosec:
      excludes:
        # G115 (integer overflow on conversion) fires on every Modbus register
        # decode. Reading a signed register is a same-width two's-complement
        # reinterpretation (uint16 -> int16), which cannot overflow, and the
        # RTC writes convert time fields whose ranges time.Time guarantees fit
        # in a byte. Every occurrence in this codebase is a false positive, and
        # each new register decode would add another, so the rule is excluded
        # rather than annotated at ~10 call sites. All other gosec rules —
        # notably hardcoded credentials, file permissions, and TLS config —
        # remain blocking.
        - G115
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^site/node_modules/
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lumberbarons/modbus
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^site/node_modules/
