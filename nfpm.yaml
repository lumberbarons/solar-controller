name: solar-controller
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: default
priority: optional
maintainer: Lumberbarons <https://github.com/lumberbarons>
description: Solar power equipment monitoring service with MQTT, Solace, and Prometheus support
vendor: Lumberbarons
homepage: https://github.com/lumberbarons/solar-controller
license: MIT

contents:
  # Main binary
  - src: bin/solar-controller
    dst: /usr/bin/solar-controller
    file_info:
      mode: 0755

  # Configuration file: not world-readable, it may hold broker credentials.
  # Group ownership is fixed up in postinstall once the service user exists.
  - src: package/config.yaml
    dst: /etc/solar-controller/config.yaml
    type: config
    file_info:
      mode: 0640

  # Systemd service file
  - src: package/solar-controller.service
    dst: /etc/systemd/system/solar-controller.service
    file_info:
      mode: 0644

  # Logrotate configuration
  - src: package/logrotate.d/solar-controller
    dst: /etc/logrotate.d/solar-controller
    file_info:
      mode: 0644

scripts:
  postinstall: package/postinstall.sh
  postremove: package/postremove.sh

# bluez is a recommendation rather than a dependency: it is needed only by the
# voltgo BLE controller, and an epever-only install has no use for it. The
# service does not get access to org.bluez by installing it — see the Bluetooth
# LE section of the README for the systemd drop-in that grants that.
overrides:
  deb:
    depends:
      - systemd
    recommends:
      - bluez
  rpm:
    depends:
      - systemd
    recommends:
      - bluez
